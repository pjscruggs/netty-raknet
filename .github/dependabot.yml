version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directories:
      - /
      - /buildSrc
      - /quality
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
