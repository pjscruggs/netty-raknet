name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, test, and check all Java sources
        run: ./gradlew build --no-daemon --max-workers=2 --warning-mode fail
      - name: Verify packaged notices and the Java compatibility baseline
        run: python quality/verify_artifacts.py
      - name: Validate security report policy
        run: python -m unittest discover -s quality -p test_sarif.py
      - name: Validate workflow syntax
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Preserve selected test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tests-${{ matrix.os }}
          path: |
            common/build/test-results/test/*.xml
            client/build/test-results/test/*.xml
            server/build/test-results/test/*.xml
            tests/build/test-results/test/*.xml
            quality/build/test-results/test/*.xml
            quality/build/reports/checkstyle/*.xml
            quality/build/reports/pmd/*.xml
          retention-days: 7
      - name: Preserve library artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Libraries-${{ matrix.os }}
          path: |
            common/build/libs/*.jar
            client/build/libs/*.jar
            server/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Tests (JDK ${{ matrix.java }}, Netty ${{ matrix.netty }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
            netty: 4.1.25.Final
          - java: 17
            netty: 4.1.140.Final
          - java: 21
            netty: 4.1.140.Final
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Exercise transport on the selected runtime
        env:
          NETTY_TEST_VERSION: ${{ matrix.netty }}
        run: ./gradlew test "-PnettyTestVersion=$NETTY_TEST_VERSION" --no-daemon --max-workers=2 --warning-mode fail

  integration:
    name: Raknetify2 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed consumer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pjscruggs/raknetify2
          ref: 5299ada2da82d7264e49a5f54c48c7eee7365ce5
          fetch-depth: 0
          persist-credentials: false
      - name: Substitute the exact candidate transport revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pjscruggs/netty-raknet
          ref: ${{ github.sha }}
          path: netty-raknet
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/setup-checks
      - name: Build all consumer modules and run their unit and source checks
        run: ./gradlew build :common:transportProbe --no-daemon --max-workers=2 --warning-mode fail

  required:
    name: Required checks
    if: always()
    needs: [build, compatibility, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build and compatibility job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
