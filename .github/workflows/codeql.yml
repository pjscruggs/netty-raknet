name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query-tests:
    name: CodeQL query regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25
      - uses: github/codeql-action/setup-codeql@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: query-tools
        with:
          languages: java-kotlin
      - name: Verify callback and ordinary-method analysis
        env:
          CODEQL_CLI: ${{ steps.query-tools.outputs.codeql-path }}
        run: |
          "$CODEQL_CLI" pack install quality/codeql
          "$CODEQL_CLI" test run quality/codeql/tests --threads=2

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: query-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.build-mode == 'manual'
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.build-mode == 'manual'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.language == 'java-kotlin' && './quality/codeql/security-and-quality.qls' || 'security-and-quality' }}
      - name: Compile production and regression sources for analysis
        if: matrix.build-mode == 'manual'
        # Resolve the declared API baseline consistently during source extraction.
        # The build workflow separately exercises the maintained Netty runtime.
        run: ./gradlew classes testClasses -PnettyTestVersion=4.1.25.Final --no-build-cache --rerun-tasks --no-daemon --max-workers=2 --warning-mode fail
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Reject incomplete reports or security and correctness findings
        run: python3 quality/check_sarif.py codeql-results
